---
title: Industries
image_view: true
---
<h1>Industries</h1>



{% if page.image_view %}
	{% for category in site.categories %}
		<h2>{{ category[0] }}</h2>
		<div class="projects">
			{% for project in category[1] %}
				<div class="project" style="background-image: url('{{ project.featured_image }}')">
					<a href="{{ site.baseurl }}{{ project.url }}"><span>{{ project.title }}</span></a>
				</div>
			{% endfor %}
		</div>
	{% endfor %}
{% endif %}
